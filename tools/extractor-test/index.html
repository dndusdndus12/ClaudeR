<script>
const FIXTURES = [
  { id: 'fx-textnodes', rule: {}, expect: r => [
      ['chapterTitle', r.chapterTitle === '第二十九章 山门初开之时【第一更】'],
      ['workTitle', r.workTitle === '青石问道'],
      ['contentPath', r.contentPath === 'div.txtnav'],
      ['문단 수 8 (제목 줄, 본장완 포함)', r.paragraphs.length === 8],
      ['광고 줄 없음', !r.paragraphs.some(p => /Skip|广告|作者/.test(p))],
      ['nextUrl', /\/txt\/21160\/12097700$/.test(r.nextUrl || '')],
      ['prevUrl', /\/txt\/21160\/12097698$/.test(r.prevUrl || '')],
      ['blocked=false', r.blocked === false],
    ] },
  { id: 'fx-paragraphs', rule: {}, expect: r => [
      ['chapterTitle', r.chapterTitle === '第12章 夜雨'],
      ['workTitle', r.workTitle === '雨巷'],
      ['contentPath', r.contentPath === 'div#content'],
      ['숨김 문단 제외', !r.paragraphs.some(p => p.includes('首发'))],
      ['문단 수 7 (hr 포함)', r.paragraphs.length === 7],
      ['hr 표시', r.paragraphs.includes('-----')],
      ['nextUrl', /\/book\/1\/13\.html$/.test(r.nextUrl || '')],
      ['prevUrl', /\/book\/1\/11\.html$/.test(r.prevUrl || '')],
    ] },
  { id: 'fx-paragraphs', label: 'fx-paragraphs + 규칙', rule: { content: '#content p', title: 'article h1', next: 'a[rel=next]', workTitle: '.breadcrumb a:nth-child(2)' }, expect: r => [
      ['contentSource=rule', r.contentSource === 'rule'],
      ['chapterTitle', r.chapterTitle === '第12章 夜雨'],
      ['workTitle', r.workTitle === '雨巷'],
      ['문단 수 6', r.paragraphs.length === 6],
      ['nextUrl', /13\.html$/.test(r.nextUrl || '')],
    ] },
  { id: 'fx-paragraphs', label: 'fx-paragraphs + 틀린 규칙', rule: { content: '#nope', next: 'a[[' }, expect: r => [
      ['자동 추출로 대체', r.contentSource === 'auto' && r.paragraphs.length === 7],
      ['경고 2건', r.warnings.length === 2],
      ['nextUrl 자동 인식', /13\.html$/.test(r.nextUrl || '')],
    ] },
  { id: 'fx-divs', rule: {}, expect: r => [
      ['문단 수 5', r.paragraphs.length === 5],
      ['짧은 대사 유지', r.paragraphs.includes('“好。”')],
      ['chapterTitle', r.chapterTitle === '第五章 入门'],
      ['nextUrl 없음', r.nextUrl === null],
      ['nextClickable', r.nextClickable === true],
      ['클릭 표시', r.__clickResult === 'next'],
    ] },
  { id: 'fx-challenge', rule: {}, expect: r => [
      ['blocked', r.blocked === true],
      ['본문 거의 없음', r.paragraphs.join('').length < 100],
    ] },
];

async function run() {
  const src = await (await fetch('../../app/src/main/assets/extractor.js', { cache: 'no-store' })).text();
  const out = document.getElementById('out');
  const results = [];
  let failed = 0;
  for (const fx of FIXTURES) {
    const html = document.getElementById(fx.id).innerHTML;
    const frame = document.createElement('iframe');
    out.appendChild(Object.assign(document.createElement('h2'), { textContent: fx.label || fx.id }));
    out.appendChild(frame);
    await new Promise(res => { frame.onload = res; frame.srcdoc = '<base href="https://fixture.test/dir/page.html">' + html; });
    let r, error = null;
    try {
      r = frame.contentWindow.eval('(' + src + ')(' + JSON.stringify(fx.rule) + ')');
      const btn = frame.contentDocument.querySelector('[data-clauder-nav="next"]');
      if (btn && !r.nextUrl) { btn.click(); r.__clickResult = frame.contentWindow.__clicked; }
    } catch (e) { error = String(e && e.stack || e); }
    const checks = error ? [['실행 오류: ' + error, false]] : fx.expect(r);
    const ul = document.createElement('ul');
    for (const [name, ok] of checks) {
      if (!ok) failed++;
      ul.appendChild(Object.assign(document.createElement('li'), { textContent: (ok ? 'PASS ' : 'FAIL ') + name, className: ok ? 'pass' : 'fail' }));
    }
    out.appendChild(ul);
    out.appendChild(Object.assign(document.createElement('pre'), { textContent: JSON.stringify(r, null, 2) }));
    results.push({ fixture: fx.label || fx.id, checks: checks.map(([n, ok]) => (ok ? 'PASS ' : 'FAIL ') + n), result: r, error });
  }
  document.getElementById('summary').innerHTML = failed ? '<p class="fail">실패 ' + failed + '건</p>' : '<p class="pass">모두 통과</p>';
  window.__results = results;
  window.__failed = failed;
}
run().catch(e => { window.__failed = -1; window.__error = String(e); document.getElementById('summary').textContent = '오류: ' + e; });
</script>
</body>
